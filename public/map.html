<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map · LightHunt</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="page">
    <div class="page-head">
      <h1 class="title" id="page-title">Any place can be a <em>spot</em></h1>
      <p class="subtitle">Search for a place or drop a pin to see the light.</p>
    </div>
    <div class="grid grid-side">
      <div id="map-area"></div>
      <div class="card">
        <h3>Approved <em>spots</em></h3>
        <div id="spot-list" class="stack hint">Loading…</div>
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/map.js"></script>
</body>
</html>
